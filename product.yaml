# product.yaml: the one file a product owes the company.
#
# The company registry (eugnel-hq) reads this file from `main` and never edits it. The AI-SDLC
# channel modules write `live_version` and `live_since`; the baseline step writes `baseline`;
# the owner or an intake writes `status`. Validate with `.ai-sdlc/manifest_check.py product.yaml`
# (run it by hand: the company `manifest` check is pending here, see AGENTS.md). Schema: the
# skill's `schemas/product.schema.json`.

id: glassvow
name: Glassvow
status: building             # TestFlight builds only; not on sale yet (docs/rc-bar.md)
repo: eugnel-ltd/glassvow
north_star: docs/north-star.md
support: glassvow@eugnel.com
# Read by the company support intake (docs/release-signing.md, "Sentry operator access").
sentry:
  org: pgnetwork
  project: glassvow
  scope: client

channels:
  ios:
    bundle_id: uk.eugnel.glassvow    # Team GPABDG7FX9; export_presets.cfg; iOS is the first store (docs/rc-bar.md)
    live_version: null
    live_since: null
  play:
    package: io.fol2.glassvow        # export_presets.cfg; Android is unchanged; it ships after iOS
    live_version: null
    live_since: null
  # The static game site (site/, glassvow.eugnel.com): privacy policy, company information and contact. It sells nothing.
  web:
    domain: glassvow.eugnel.com
    live_version: null
    live_since: null

# Paid download: US$6.99 launch base price, Apple regional prices, no introductory discount
# (#243, signed 19 Aug 2026). Expansion-pack IAP remains a later possibility, not a launch SKU.
pricing:
  model: one-off
  products:
    # SKU kept from the #426 personal-team record. The EUGNEL App Store Connect
    # app id is unset until Len creates that record; #426's 6803851427 is not
    # the shipping identity.
    - sku: GLASSVOW-IOS-2026
      store_ids:
        ios: null

# The product baseline (skill `modules/baseline.md`). Values: done | missing | waived | excluded.
baseline:
  accounts: excluded         # no accounts, chat or online features (docs/privacy/privacy-policy.en.md)
  durable_data: done         # saves stay on the device (the v2 save lineage, AGENTS.md)
  payments: missing          # #426 records account setup; current sale/price proof still pending (#755)
  legal: missing             # EUGNEL LTD named as controller; live page deploy and solicitor review still open (#753)
  observability: done        # Sentry pgnetwork/glassvow
  support: done              # glassvow@eugnel.com on the site and in the privacy policy
  listing: missing           # bilingual text in docs/product/listing/; live fields/assets not verified (#427)
waivers: {}
exclusions:
  accounts: "Glassvow accounts: the game has no accounts, chat or online features; saves stay on the device."
