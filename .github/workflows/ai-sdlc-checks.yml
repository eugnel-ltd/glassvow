# Thin caller for the AI-SDLC PR checks. Copy to .github/workflows/ai-sdlc-checks.yml.
# The checks run the scripts in .ai-sdlc/ as they are on the base branch (installed and refreshed
# by the skill's scripts/adopt.sh); they read the PR as data and never execute its code, which is
# why pull_request_target is safe here and why a PR cannot weaken its own gate.
# Branch protection: require the status context `ai-sdlc/review-on-head` (written on the PR head
# on every run, including runs started by a comment) and the jobs owner-decisions, locked-tests,
# secret-scan and manifest. Protect .github/workflows/ and .ai-sdlc/ with CODEOWNERS. The skill repo must allow
# reusable workflows for this organisation (Settings → Actions → Access).
# Runner: self-hosted by owner decision (no paid Actions minutes); the runner holds git, gh and sh.
# Pass runs_on to use other labels.
name: AI-SDLC checks

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  pull-requests: read
  issues: read
  statuses: write

jobs:
  checks:
    uses: eugnel-ltd/ai-sdlc/.github/workflows/checks.yml@v3
    with:
      base: main
      # scripts_dir: .ai-sdlc
      runs_on: '["self-hosted", "ai-sdlc"]'
      # test_paths: "tests/ :(glob)**/test_*.py"
