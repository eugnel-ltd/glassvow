name: Native complete mip upload proof

on:
  workflow_dispatch:
  pull_request:
    paths:
      - tools/godot/patches/glassvow-660-bounded-mip-upload.patch
      - tools/godot/patches/glassvow-660-compressed-upload-staging.patch
      - tools/godot/native_texture_mips/**
      - tools/godot/native_boot_upload/build.py
      - tools/godot/native_boot_upload/processes.py
      - tools/godot/native_boot_upload/verify.py
      - tools/godot/native_texture_staging/**
      - tests/native/test_texture_mip_batches.py
      - tests/native/texture_mip_batches.cpp.in
      - tests/native/test_texture_mip_evidence.py
      - tests/native/test_native_mip_builder.py
      - tests/native/test_native_mip_runtime_config.py
      - tests/native/test_native_mip_hosted_regressions.py
      - tests/native/test_native_mip_metal.py
      - tests/native/test_native_mip_metal_delivery.py
      - tests/native/test_native_mip_metal_controller.py
      - tests/native/test_native_mip_metal_workflow.py
      - tests/native/fixtures/mip-hosted-117746266505/**
      - .github/workflows/native-texture-mips.yml

permissions:
  contents: read

concurrency:
  group: native-texture-mips-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-mip-requests:
    # Archived qualification path: job 117746266505 had no ASTC support and failed.
    # Do not repeat its expensive pair or relabel that INCONCLUSIVE result PASS.
    # Maintained physical-format qualification now runs in the explicit Mac job.
    if: ${{ false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check out the exact allocator prerequisite from this repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ github.repository }}
          ref: 0d9df1eca065ad2e882dc11aea875e555e42d75b
          path: prerequisite
          sparse-checkout: tools/godot/patches/glassvow-660-compressed-upload-staging.patch
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Install bounded native compiler and software renderer dependencies
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential pkg-config \
            libx11-dev libxcursor-dev libxinerama-dev libxi-dev libxrandr-dev \
            libgl1-mesa-dev libvulkan-dev mesa-vulkan-drivers libasound2-dev \
            libpulse-dev libudev-dev xvfb xauth
          python3 -m venv work/native-mips-venv
          work/native-mips-venv/bin/python -m pip install SCons==4.9.1 Pillow==11.3.0 numpy==2.2.6
      - name: Reject seeded evidence defects and verify exact source application
        timeout-minutes: 3
        run: |
          mkdir -p work/native-mips-evidence work/native-mips-source
          work/native-mips-venv/bin/python -m unittest discover -s tests/native -p 'test_*mip*.py'
          work/native-mips-venv/bin/python tools/godot/native_boot_upload/test_harness.py
          work/native-mips-venv/bin/python - <<'PY'
          import json,pathlib,urllib.request
          contract=json.loads(pathlib.Path('tools/godot/native_texture_mips/contract.json').read_text())
          for role,pin in zip(('stable','shipping'),contract['source_pins']):
              url=f'https://raw.githubusercontent.com/godotengine/godot/{pin}/servers/rendering/rendering_device.cpp'
              with urllib.request.urlopen(url,timeout=30) as response:
                  data=response.read(1024*1024+1)
              if len(data)>1024*1024:
                  raise SystemExit('source file exceeds bounded retrieval')
              pathlib.Path(f'work/native-mips-source/{role}.cpp').write_bytes(data)
          PY
          work/native-mips-venv/bin/python tools/godot/native_texture_mips/check_patch.py \
            --source work/native-mips-source/stable.cpp --shipping-source work/native-mips-source/shipping.cpp \
            --prerequisite-patch prerequisite/tools/godot/patches/glassvow-660-compressed-upload-staging.patch \
            --output work/native-mips-evidence/source-application
      - name: Compile and exercise immutable whole-chain red then bounded green fixture
        timeout-minutes: 3
        run: |
          set +e
          work/native-mips-venv/bin/python tests/native/test_texture_mip_batches.py \
            --source work/native-mips-evidence/source-application/stable-allocator-baseline.cpp --build-dir work/native-mips-evidence/old-red
          code=$?
          set -e
          test "$code" -eq 1
          work/native-mips-venv/bin/python - <<'PY'
          import json,pathlib
          root=pathlib.Path('work/native-mips-evidence/old-red')
          report=json.loads((root/'result.json').read_text())
          assert report['compile_exit']==0 and report['native_exit']==1
          assert report['source_sha256']=='ac38319ac1cf7da23889580b158d4a5e89fd4e4552d73760f0a2081ed076a4d3'
          log=(root/'native.log').read_text()
          assert 'FAIL bounded staging request' in log and 'requests=5592432,' in log
          assert 'AddressSanitizer' not in log and 'runtime error:' not in log
          PY
          work/native-mips-venv/bin/python tests/native/test_texture_mip_batches.py \
            --source work/native-mips-evidence/source-application/stable/servers/rendering/rendering_device.cpp \
            --build-dir work/native-mips-evidence/candidate-green
      - name: Compile allocator-only baseline and bounded candidate from the same sealed archive
        timeout-minutes: 62
        run: |
          work/native-mips-venv/bin/python tools/godot/native_boot_upload/build.py \
            --prerequisite-patch prerequisite/tools/godot/patches/glassvow-660-compressed-upload-staging.patch \
            --production-patch tools/godot/patches/glassvow-660-bounded-mip-upload.patch \
            --observer tools/godot/native_texture_mips/observer.py --test-suite '' \
            --work work/native-mips-builds --output work/native-mips-evidence
      - name: Observe actual RD requests and every GPU mip byte
        timeout-minutes: 5
        run: |
          work/native-mips-venv/bin/python - <<'PY'
          import glob,json,os,pathlib,subprocess
          icds=glob.glob('/usr/share/vulkan/icd.d/*lvp*.json')
          if len(icds)!=1:
              raise SystemExit('required software Vulkan ICD absent or ambiguous')
          os.environ['VK_DRIVER_FILES']=icds[0]
          inputs=json.loads(pathlib.Path('work/native-mips-evidence/render-inputs.json').read_text())
          for variant in ('baseline','candidate'):
              subprocess.run(['work/native-mips-venv/bin/python','tools/godot/native_texture_mips/probe.py',
                  '--variant',variant,'--binary',inputs[variant],'--output',f'work/native-mips-evidence/{variant}-rd'],check=True,timeout=135)
          PY
          work/native-mips-venv/bin/python tools/godot/native_texture_mips/verify.py \
            --baseline work/native-mips-evidence/baseline-rd --candidate work/native-mips-evidence/candidate-rd \
            --build-manifest work/native-mips-evidence/build-manifest.json \
            --output work/native-mips-evidence/actual-rd-proof.json
      - name: Print bounded generated diagnostics when a component fails
        if: failure()
        timeout-minutes: 1
        run: |
          python3 - <<'PY'
          import pathlib
          root=pathlib.Path('work/native-mips-evidence').resolve()
          logs=sorted(root.rglob('*.log')) if root.is_dir() else []
          for path in logs[:16]:
              if path.is_symlink() or not path.is_file() or not path.resolve().is_relative_to(root):
                  continue
              with path.open('rb') as stream:
                  stream.seek(max(0,path.stat().st_size-8000))
                  tail=stream.read(8000).decode('utf-8',errors='replace')
              print(f'::group::Generated diagnostic {path.relative_to(root)}')
              print(tail)
              print('::endgroup::')
          PY
      - name: Keep exact-head evidence and failure logs
        if: always()
        timeout-minutes: 3
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-texture-mips-${{ github.sha }}
          path: |
            work/native-mips-evidence/
            !work/native-mips-evidence/**/project/**
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
  paired-macos-metal-mips:
    runs-on: macos-15
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      PYTHONUNBUFFERED: "1"
      VIGIL_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Initialise bounded desktop Metal evidence
        timeout-minutes: 1
        run: |
          mkdir -p "$RUNNER_TEMP/native-mips-metal-evidence"
          printf '%s\n' 'Desktop Metal component; iOS/A12/template/memory/timing and Vulkan 256-byte row controls unqualified.' \
            > "$RUNNER_TEMP/native-mips-metal-evidence/scope.txt"
      - name: Check out the exact Vigil source and every cheap-fixture dependency
        timeout-minutes: 2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: vigil
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/native-texture-mips.yml
            /tests/native/
            /tools/godot/native_texture_mips/
            /tools/godot/native_boot_upload/
            /tools/godot/patches/glassvow-660-bounded-mip-upload.patch
      - name: Check out the immutable shared Mac runtime and allocator prerequisite
        timeout-minutes: 2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ github.repository }}
          ref: 1aebd36a47ceee6d5d74328b79b852d1e0eb95db
          path: shared-runtime
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/godot/native_texture_staging/
            /tools/godot/patches/glassvow-660-compressed-upload-staging.patch
      - name: Check out immutable pure builder helpers separately
        timeout-minutes: 2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ github.repository }}
          ref: a08e1ab8f9b5e1c8c0dd3e8c450db839f0a5acb6
          path: shared-builder
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/godot/native_boot_upload/
      - name: Select pinned Python 3.12 on arm64
        timeout-minutes: 2
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          architecture: arm64
      - name: Install only pinned component Python dependencies
        timeout-minutes: 3
        run: |
          python3.12 -m venv "$RUNNER_TEMP/native-mips-metal-venv"
          "$RUNNER_TEMP/native-mips-metal-venv/bin/python" -m pip install \
            SCons==4.9.1 Pillow==11.3.0 numpy==2.2.6
      - name: Bind immutable helpers and preflight actual sparse transitive imports
        timeout-minutes: 2
        run: |
          test "$(git -C vigil rev-parse HEAD)" = "$VIGIL_HEAD"
          git -C vigil rev-parse HEAD > "$RUNNER_TEMP/native-mips-metal-evidence/vigil-head.txt"
          git -C shared-runtime rev-parse HEAD > "$RUNNER_TEMP/native-mips-metal-evidence/shared-runtime-head.txt"
          git -C shared-builder rev-parse HEAD > "$RUNNER_TEMP/native-mips-metal-evidence/shared-builder-head.txt"
          "$RUNNER_TEMP/native-mips-metal-venv/bin/python" -B - <<'PY'
          import hashlib,importlib.util,json,os,pathlib,subprocess
          root=pathlib.Path('vigil').resolve()
          own=root/'tools/godot/native_texture_mips'
          source=pathlib.Path('shared-runtime/tools/godot/native_texture_staging').resolve()
          builder=pathlib.Path('shared-builder/tools/godot/native_boot_upload/build.py').resolve()
          manifest=own/'metal-shared-inputs.json'
          pins=json.loads(manifest.read_text())
          for directory,expected in ((source,pins['runtime_source_head']),(builder.parent,pins['builder_source_head'])):
              assert subprocess.check_output(['git','-C',str(directory),'rev-parse','HEAD'],text=True).strip()==expected
          destination=root/'tools/godot/native_texture_staging'
          destination.mkdir(exist_ok=True)
          for name,expected in pins['runtime'].items():
              data=(source/name).read_bytes()
              assert hashlib.sha256(data).hexdigest()==expected
              (destination/name).write_bytes(data)
          spec=importlib.util.spec_from_file_location('vigil_metal_controller',own/'metal.py')
          controller=importlib.util.module_from_spec(spec);spec.loader.exec_module(controller)
          identity=controller.inputs(builder,source,manifest)[3]
          controller.load_shared(builder)
          output=pathlib.Path(os.environ['RUNNER_TEMP'])/'native-mips-metal-evidence'
          (output/'shared-helper-inputs.json').write_text(json.dumps(identity,indent=2)+'\n')
          PY
          cd vigil
          "$RUNNER_TEMP/native-mips-metal-venv/bin/python" -B -m unittest discover -s tests/native -p 'test_*mip*.py'
      - name: Screen this exact stock Mac host before any native source download or build
        timeout-minutes: 6
        run: |
          "$RUNNER_TEMP/native-mips-metal-venv/bin/python" -B \
            vigil/tools/godot/native_texture_staging/capability.py \
            --profile macos-arm64-metal-v1 --head "$VIGIL_HEAD" \
            --work "$RUNNER_TEMP/native-mips-metal-stock-work" \
            --output "$RUNNER_TEMP/native-mips-metal-evidence/venue"
      - name: Retrieve the sealed source archive with the existing bounded helper
        timeout-minutes: 4
        run: |
          "$RUNNER_TEMP/native-mips-metal-venv/bin/python" -B - <<'PY'
          import importlib.util,os,pathlib
          path=pathlib.Path('vigil/tools/godot/native_texture_mips/metal.py')
          spec=importlib.util.spec_from_file_location('vigil_archive_inputs',path)
          controller=importlib.util.module_from_spec(spec);spec.loader.exec_module(controller)
          builder=pathlib.Path('shared-builder/tools/godot/native_boot_upload/build.py').resolve()
          source=pathlib.Path('shared-runtime/tools/godot/native_texture_staging').resolve()
          manifest=path.parent/'metal-shared-inputs.json'
          controller.inputs(builder,source,manifest)
          _,support,shared=controller.load_shared(builder)
          support.verify_venue(pathlib.Path(os.environ['RUNNER_TEMP'])/'native-mips-metal-evidence/venue/result.json',os.environ['VIGIL_HEAD'])
          archive=pathlib.Path(os.environ['RUNNER_TEMP'])/'native-mips-metal-source/upstream.tar.gz'
          archive.parent.mkdir(exist_ok=False)
          shared.download(archive)
          assert shared.digest(archive)==support.ARCHIVE
          PY
      - name: Build the exact pair and require strict Vigil Metal upload and readback proof
        timeout-minutes: 75
        run: |
          "$RUNNER_TEMP/native-mips-metal-venv/bin/python" -B \
            vigil/tools/godot/native_texture_mips/metal.py \
            --head "$VIGIL_HEAD" \
            --venue-receipt "$RUNNER_TEMP/native-mips-metal-evidence/venue/result.json" \
            --shared-builder "$GITHUB_WORKSPACE/shared-builder/tools/godot/native_boot_upload/build.py" \
            --runtime-source "$GITHUB_WORKSPACE/shared-runtime/tools/godot/native_texture_staging" \
            --shared-manifest "$GITHUB_WORKSPACE/vigil/tools/godot/native_texture_mips/metal-shared-inputs.json" \
            --prerequisite-patch "$GITHUB_WORKSPACE/shared-runtime/tools/godot/patches/glassvow-660-compressed-upload-staging.patch" \
            --source-archive "$RUNNER_TEMP/native-mips-metal-source/upstream.tar.gz" \
            --work "$RUNNER_TEMP/native-mips-metal-build" \
            --output "$RUNNER_TEMP/native-mips-metal-evidence/component"
      - name: Print bounded generated diagnostics after failure
        if: failure()
        timeout-minutes: 1
        run: |
          python3 -B - <<'PY'
          import os,pathlib
          root=(pathlib.Path(os.environ['RUNNER_TEMP'])/'native-mips-metal-evidence').resolve()
          for path in sorted(root.rglob('*.log'))[:16]:
              if path.is_symlink() or not path.is_file() or not path.resolve().is_relative_to(root): continue
              with path.open('rb') as stream:
                  stream.seek(max(0,path.stat().st_size-8000));data=stream.read(8000)
              print('::group::Generated diagnostic '+str(path.relative_to(root)))
              print(data.decode('utf-8',errors='replace'));print('::endgroup::')
          PY
      - name: Preserve bounded Metal evidence and inconclusive or failure logs
        if: always()
        timeout-minutes: 3
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-texture-mips-metal-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/native-mips-metal-evidence/
            !${{ runner.temp }}/native-mips-metal-evidence/**/project/**
            !${{ runner.temp }}/native-mips-metal-evidence/**/xdg-*/**
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
